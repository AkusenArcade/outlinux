<!doctype html>
<meta charset="utf-8" />
<title>Autenticazione richiesta</title>
<style>
  :root { color-scheme: light dark; --bg: #faf9f8; --fg: #201f1e; --muted: #605e5c; --line: #c8c6c4; --accent: #0f6cbd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #292827; --fg: #f3f2f1; --muted: #a19f9d; --line: #484644; --accent: #479ef5; }
  }
  html { overflow: hidden; }
  body { margin: 0; padding: 1.25rem; background: var(--bg); color: var(--fg);
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  form { display: flow-root; }
  h1 { font-size: 1rem; margin: 0 0 .25rem; }
  p.host { margin: 0 0 1rem; color: var(--muted); font-size: .85rem; word-break: break-all; }
  label { display: block; margin-bottom: .75rem; }
  span { display: block; margin-bottom: .25rem; font-size: .85rem; color: var(--muted); }
  input { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit;
          border: 1px solid var(--line); border-radius: 4px; background: transparent; color: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .remember { display: flex; align-items: center; gap: .5rem; margin-top: -.25rem; font-size: .85rem; }
  .remember input { width: auto; }
  .remember span { display: inline; margin: 0; color: inherit; }
  .note { margin: .5rem 0 0; font-size: .78rem; color: var(--muted); }
  .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.25rem; }
  button { padding: .5rem 1.1rem; font: inherit; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--line); background: transparent; color: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
<form id="form">
  <h1>Autenticazione richiesta</h1>
  <p class="host" id="host"></p>
  <label>
    <span>Nome utente</span>
    <input id="username" autocomplete="username" autofocus required />
  </label>
  <label>
    <span>Password</span>
    <input id="password" type="password" autocomplete="current-password" required />
  </label>
  <label class="remember" id="rememberRow">
    <input type="checkbox" id="remember" checked />
    <span>Ricorda le credenziali</span>
  </label>
  <p class="note" id="note"></p>
  <div class="actions">
    <button type="button" id="cancel">Annulla</button>
    <button type="submit" class="primary">Accedi</button>
  </div>
</form>
<script>
  const params = new URLSearchParams(location.search);
  const scheme = params.get('scheme') || '';
  document.getElementById('host').textContent =
    `${params.get('host') || ''}${scheme ? ` · ${scheme.toUpperCase()}` : ''}`;

  document.getElementById('form').addEventListener('submit', (event) => {
    event.preventDefault();
    window.outlinuxAuth.submit({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      remember: document.getElementById('remember').checked
    });
  });
  // Senza portachiavi di sistema la password non può essere cifrata: niente salvataggio.
  if (params.get('canRemember') !== '1') {
    document.getElementById('rememberRow').hidden = true;
    document.getElementById('remember').checked = false;
    document.getElementById('note').textContent =
      'Portachiavi di sistema non disponibile: le credenziali non verranno salvate.';
  } else {
    document.getElementById('note').textContent =
      'La password viene cifrata nel portachiavi di sistema.';
  }

  document.getElementById('cancel').addEventListener('click', () => window.outlinuxAuth.cancel());
</script>
