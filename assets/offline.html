<!doctype html>
<meta charset="utf-8" />
<title>Outlinux · Connessione non riuscita</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.6 system-ui, "Segoe UI", sans-serif;
    background: #faf9f8; color: #201f1e;
  }
  @media (prefers-color-scheme: dark) { body { background: #1b1a19; color: #f3f2f1; } }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: .4rem 0; opacity: .85; }
  code { font-size: .85em; opacity: .7; word-break: break-all; }
  button {
    margin-top: 1.5rem; padding: .6rem 1.4rem; font: inherit; cursor: pointer;
    border: 0; border-radius: 4px; background: #0f6cbd; color: #fff;
  }
  button:hover { background: #115ea3; }
</style>
<main>
  <h1>Impossibile raggiungere Outlook</h1>
  <p>Controlla la connessione di rete e riprova.</p>
  <p><code id="err"></code></p>
  <button id="retry">Riprova</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  document.getElementById('err').textContent = params.get('error') || '';
  const home = params.get('home') || 'https://outlook.office.com/mail/';
  document.getElementById('retry').addEventListener('click', () => { location.href = home; });
</script>
